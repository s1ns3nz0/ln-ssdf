name: CI and keyless provenance
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '20' }
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with: { version: v3.17.3 }
      - run: scripts/ci-verify.sh
  attest-source:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '20' }
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
        with: { cosign-release: v2.6.0 }
      - run: node scripts/generate-ci-provenance.mjs artifacts/ci-provenance.json
      - run: cosign sign-blob --yes --bundle artifacts/ci-provenance.bundle.json artifacts/ci-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-provenance-${{ github.sha }}
          path: artifacts/ci-provenance.*
          if-no-files-found: error
