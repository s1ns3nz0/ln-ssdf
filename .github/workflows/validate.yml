name: Validate

on:
  pull_request:
  push:
    branches: [main]

# Validation needs only the checked-out source. Publishing and OIDC are kept in
# the separately named provenance workflow.
permissions:
  contents: read

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
      - name: Set up Helm
        uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.17.3
      - name: Run repository verification script
        run: scripts/ci-verify.sh
