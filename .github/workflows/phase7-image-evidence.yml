name: Phase 7 image evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  attest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - grafana/grafana:12.0.1@sha256:06dc8d60e184705e5dc00e051a6d92342a44010d7d5e538d0a36339e85abb9b7
          - lightninglabs/lnd:v0.18.5-beta@sha256:2b560c9beb559c57ab2f2da1dfed80d286cf11a6dc6e4354cab84aafba79b6f6
          - lightninglabs/lndmon:v0.2.15@sha256:231d981ddafb6ab73fc6e1ff29697b99f29a1ddcf17c13f8b72267ca3939e8e5
          - lncm/bitcoind:v26.0@sha256:2a335ea0e77106fc8768cade374808485a43825a6b4a17e85dd36d4acd931b22
          - postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          - prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          - prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '20' }
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
        with: { cosign-release: v2.6.0 }
      - name: Scan and produce CycloneDX SBOM
        env: { IMAGE: ${{ matrix.image }} }
        run: |
          mkdir -p artifacts
          docker run --rm aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --image-src remote --format cyclonedx --output artifacts/sbom.cdx.json "$IMAGE"
          docker run --rm aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --image-src remote --format json --output artifacts/trivy.json "$IMAGE"
      - name: Build VSA predicate
        env: { IMAGE: ${{ matrix.image }} }
        run: node scripts/generate-phase7-vsa.mjs artifacts/sbom.cdx.json artifacts/trivy.json "$IMAGE" artifacts/vsa.json | tee artifacts/result.json
      - name: Publish keyless SBOM and VSA to the dedicated evidence repository
        env:
          IMAGE: ${{ matrix.image }}
          COSIGN_REPOSITORY: ghcr.io/s1ns3nz0/ln-ssdf-evidence
        run: |
          cosign attest --yes --predicate artifacts/sbom.cdx.json --type https://cyclonedx.org/bom "$IMAGE"
          cosign attest --yes --predicate artifacts/vsa.json --type https://slsa.dev/verification_summary/v1 "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase7-${{ strategy.job-index }}
          path: artifacts/
          if-no-files-found: error
