apiVersion: v1
kind: Pod
metadata:
  name: recovery-approved
  namespace: experiment-2
  labels:
    ln-ssdf.io/workload: lnd-primary
  annotations:
    ln-ssdf.io/policy-version: "2026-09-21"
    ln-ssdf.io/recovery: "true"
spec:
  automountServiceAccountToken: false
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Never
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
    - effect: NoExecute
      key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 300
    - effect: NoExecute
      key: node.kubernetes.io/unreachable
      operator: Exists
      tolerationSeconds: 300
  containers:
    - name: lnd-primary
      image: 10.96.115.66:5000/fixtures/alpine@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
      imagePullPolicy: Never
      command: ["sleep", "30"]
      resources: {}
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
