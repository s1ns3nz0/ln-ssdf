apiVersion: v1
kind: Namespace
metadata:
  name: experiment-2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: experiment-2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-create-pods
  namespace: experiment-2
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-create-pods
  namespace: experiment-2
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: experiment-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-create-pods
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Approval records are versioned rather than updated in place: immutable
  # evidence cannot be swapped after a recovery request has been authorized.
  name: recovery-approval-v4
  namespace: experiment-2
immutable: true
data:
  workload: lnd-primary
  image: 10.96.115.66:5000/fixtures/alpine@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
  # These are canonical JSON encodings emitted by the CI approval issuer. The
  # admission policy compares the complete submitted values; callers do not
  # supply a trusted hash or a partial container projection.
  podSpec: '{"automountServiceAccountToken":false,"containers":[{"command":["sleep","30"],"image":"10.96.115.66:5000/fixtures/alpine@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e","imagePullPolicy":"Never","name":"lnd-primary","resources":{},"terminationMessagePath":"/dev/termination-log","terminationMessagePolicy":"File"}],"dnsPolicy":"ClusterFirst","enableServiceLinks":true,"preemptionPolicy":"PreemptLowerPriority","priority":0,"restartPolicy":"Never","schedulerName":"default-scheduler","securityContext":{},"serviceAccount":"default","serviceAccountName":"default","terminationGracePeriodSeconds":30,"tolerations":[{"effect":"NoExecute","key":"node.kubernetes.io/not-ready","operator":"Exists","tolerationSeconds":300},{"effect":"NoExecute","key":"node.kubernetes.io/unreachable","operator":"Exists","tolerationSeconds":300}]}'
  podLabels: '{"ln-ssdf.io/workload":"lnd-primary"}'
  podAnnotations: '{"ln-ssdf.io/policy-version":"2026-09-21","ln-ssdf.io/recovery":"true"}'
  policyVersion: "2026-09-21"
  approvedBy: system:serviceaccount:experiment-2:ci-deployer
  issuedAt: "2026-09-21T06:30:58Z"
  evidenceFreshUntil: "2026-09-21T06:35:58Z"
  executionLeaseExpiresAt: "2026-09-21T06:39:58Z"
  trustState: trusted
  trustStateExpiresAt: "2026-09-21T06:35:58Z"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: experiment-2-recovery-approval
spec:
  background: false
  validationFailureAction: Enforce
  rules:
    - name: require-bound-recovery-approval
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [experiment-2]
      context:
        - name: approval
          configMap:
            name: recovery-approval-v4
            namespace: experiment-2
      # A stale approval must block new or changed workload state, never the
      # deletion that removes that state.
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        message: recovery requires a current CI-issued approval bound to this exact Pod.
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.annotations.\"ln-ssdf.io/recovery\" || '' }}"
                operator: NotEquals
                value: "true"
              - key: "{{ request.object.metadata.labels.\"ln-ssdf.io/workload\" || '' }}"
                operator: NotEquals
                value: "{{ approval.data.workload }}"
              - key: "{{ request.object.spec | to_string(@) }}"
                operator: NotEquals
                value: "{{ approval.data.podSpec }}"
              - key: "{{ request.object.metadata.labels | to_string(@) }}"
                operator: NotEquals
                value: "{{ approval.data.podLabels }}"
              - key: "{{ request.object.metadata.annotations | to_string(@) }}"
                operator: NotEquals
                value: "{{ approval.data.podAnnotations }}"
              - key: "{{ request.userInfo.username }}"
                operator: NotEquals
                value: "{{ approval.data.approvedBy }}"
              - key: "{{ time_before('{{ approval.data.issuedAt }}','{{ approval.data.executionLeaseExpiresAt }}') }}"
                operator: NotEquals
                value: true
              - key: "{{ time_after('{{ approval.data.executionLeaseExpiresAt }}','{{ time_add('{{ approval.data.issuedAt }}','10m') }}') }}"
                operator: Equals
                value: true
              # evidenceFreshUntil is checked by the CI issuer against issuedAt.  It
              # is deliberately not an admission deadline: a Pod may restart while
              # an unchanged, bounded rollout is still executing.
              - key: "{{ time_before('{{ time_now_utc() }}','{{ approval.data.executionLeaseExpiresAt }}') }}"
                operator: NotEquals
                value: true
              - key: "{{ approval.data.trustState }}"
                operator: NotEquals
                value: trusted
              - key: "{{ time_before('{{ time_now_utc() }}','{{ approval.data.trustStateExpiresAt }}') }}"
                operator: NotEquals
                value: true
