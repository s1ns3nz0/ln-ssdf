apiVersion: v1
kind: Namespace
metadata:
  name: chaos-testing
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: phase12-ti-api-pod-failure
  namespace: chaos-testing
spec:
  action: pod-failure
  mode: one
  duration: 90s
  selector:
    namespaces: [opencti-system]
    labelSelectors: { app: ti-product-api }
