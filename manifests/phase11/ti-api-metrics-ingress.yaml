apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ti-product-api-prometheus-metrics
  namespace: opencti-system
spec:
  podSelector: { matchLabels: { app: ti-product-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ssdf-system } }
          podSelector: { matchLabels: { app: prometheus } }
      ports: [{ protocol: TCP, port: 8080 }]
