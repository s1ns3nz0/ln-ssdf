apiVersion: v1
kind: Namespace
metadata:
  name: ssdf-policy-test
  labels:
    ssdf.io/image-policy: enforce
---
# The workload namespace is deliberately Audit-only until Phase 7 can bind an
# image to verified provenance and SBOM evidence. A label selector prevents a
# policy-name typo from accidentally broadening this rollout.
apiVersion: v1
kind: Namespace
metadata:
  name: ssdf-system
  labels:
    ssdf.io/image-policy: audit
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: ssdf-audit-image-digest
spec:
  failurePolicy: Fail
  validationActions: [Audit]
  evaluation:
    admission: { enabled: true }
    background: { enabled: true }
  matchConstraints:
    namespaceSelector:
      matchLabels: { ssdf.io/image-policy: audit }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - message: SSDF workload images must be immutable sha256 digest references in all container classes.
      expression: >-
        object.spec.containers.all(c, c.image.matches('^.+@sha256:[a-f0-9]{64}$')) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.matches('^.+@sha256:[a-f0-9]{64}$'))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, c.image.matches('^.+@sha256:[a-f0-9]{64}$')))
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: ssdf-enforce-digest-isolated
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    admission: { enabled: true }
    background: { enabled: false }
  matchConstraints:
    namespaceSelector:
      matchLabels: { ssdf.io/image-policy: enforce }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - message: isolated policy test rejects mutable images in all container classes.
      expression: >-
        object.spec.containers.all(c, c.image.matches('^.+@sha256:[a-f0-9]{64}$')) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.matches('^.+@sha256:[a-f0-9]{64}$'))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, c.image.matches('^.+@sha256:[a-f0-9]{64}$')))
