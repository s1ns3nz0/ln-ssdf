apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-buyer-narrow-egress
  namespace: ssdf-system
spec:
  podSelector: { matchLabels: { app: payment-buyer } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: lnd, ln-ssdf.io/node: peer } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    # Aperture is deliberately selected by its payment-proxy label, never a broad namespace.
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: aperture } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ti-product-api-aperture-only
  namespace: opencti-system
spec:
  podSelector: { matchLabels: { app: ti-product-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ssdf-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: aperture } }
      ports: [{ protocol: TCP, port: 8080 }]
