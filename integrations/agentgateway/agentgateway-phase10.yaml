# Verified against AgentGateway's published standalone JSON schema on 2026-09-22.
# Local Ollama speaks the OpenAI-compatible /v1 API; no provider key is needed.
binds:
  - port: 3000
    listeners:
      - protocol: HTTP
        routes:
          - name: ollama-openai-compatible
            matches:
              - path: { pathPrefix: /v1/ }
            backends:
              - host: host.docker.internal:11434
          - name: paid-ti-via-l402-adapter
            matches:
              - path: { pathPrefix: /ti/ }
            policies:
              l402:
                methods: [GET]
                pathPrefixes: [/ti/indicator/, /ti/campaign/, /ti/report/]
              timeout: { requestTimeout: 5s, backendRequestTimeout: 5s }
              urlRewrite:
                path: { prefix: /v1/ }
            backends:
              - host: phase10-l402-adapter.phase10-system.svc.cluster.local:8080
