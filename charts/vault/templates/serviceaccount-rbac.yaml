apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ln-ssdf-vault.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ln-ssdf-vault.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ln-ssdf-vault.fullname" . }}-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "ln-ssdf-vault.fullname" . }}
    namespace: {{ .Release.Namespace }}
