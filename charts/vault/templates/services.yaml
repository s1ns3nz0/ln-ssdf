apiVersion: v1
kind: Service
metadata:
  name: {{ include "ln-ssdf-vault.fullname" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "ln-ssdf-vault.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 8200
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ln-ssdf-vault.fullname" . }}-internal
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "ln-ssdf-vault.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 8200
      targetPort: api
    - name: cluster
      port: 8201
      targetPort: cluster
