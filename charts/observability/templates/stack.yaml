apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config }
data:
  prometheus.yml: |
    global: { scrape_interval: 15s, evaluation_interval: 15s }
    scrape_configs:
      - job_name: lnd
        static_configs: [{ targets: ["lnd-primary.ssdf-system.svc:8989", "lnd-peer.ssdf-system.svc:8989"] }]
      - job_name: lndmon
        static_configs: [{ targets: ["lnd-primary.ssdf-system.svc:9092"] }]
      - job_name: postgres
        static_configs: [{ targets: ["postgres-exporter:9187"] }]
    {{- if .Values.phase11.enabled }}
      - job_name: ti-product-api
        static_configs: [{ targets: ["ti-product-api.opencti-system.svc:8080"] }]
    {{- end }}
    rule_files:
      - /etc/prometheus/rules/*.yaml
      - /etc/prometheus/rules/phase11/*.yaml
    {{- if .Values.phase11.enabled }}
    alerting:
      alertmanagers:
        - static_configs: [{ targets: ["alertmanager:9093"] }]
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-rules }
data:
  ssdf-integrity.yaml: |
    groups:
      - name: ssdf-evidence-integrity
        rules:
          - alert: SsdfEvidenceTamperDetected
            expr: ssdf_evidence_chain_tamper_detected > 0
            for: 0m
            labels: { severity: critical }
            annotations:
              summary: SSDF evidence hash chain verification failed
              description: A PostgreSQL evidence row no longer matches its append-only hash chain.
---
{{- if .Values.phase11.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: { name: phase11-prometheus-rules }
data:
  phase11.yaml: |
    groups:
      - name: ssdf-phase11
        rules:
          - alert: TiProductFailureRateHigh
            expr: sum(increase(ti_product_failures_total[15m])) / clamp_min(sum(increase(ti_product_authorized_accesses_total[15m])) + sum(increase(ti_product_failures_total[15m])), 1) > 0.05
            for: 5m
            labels: { severity: warning }
          - alert: TiApiAvailabilityLow
            expr: sum(increase(ti_product_authorized_accesses_total[15m])) / clamp_min(sum(increase(ti_product_authorized_accesses_total[15m])) + sum(increase(ti_product_failures_total[15m])), 1) < 0.95
            for: 5m
            labels: { severity: critical }
          - alert: TelemetryExportFailed
            expr: increase(otelcol_exporter_send_failed_log_records[15m]) + increase(otelcol_exporter_send_failed_spans[15m]) > 0
            for: 5m
            labels: { severity: warning }
          - alert: TelemetryRedactionFailed
            expr: increase(ssdf_telemetry_redaction_failures_total[15m]) > 0
            for: 0m
            labels: { severity: critical }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: alertmanager-config }
data:
  alertmanager.yml: |
    route: { receiver: local-operator-context }
    receivers:
      - name: local-operator-context
        webhook_configs: [{ url: http://operator-context:8080/alertmanager }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: alertmanager
          image: {{ .Values.phase11.alertmanagerImage | quote }}
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{ name: http, containerPort: 9093 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 5 }
          volumeMounts: [{ name: config, mountPath: /etc/alertmanager, readOnly: true }]
      volumes: [{ name: config, configMap: { name: alertmanager-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager }
spec:
  selector: { app: alertmanager }
  ports: [{ name: http, port: 9093, targetPort: http }]
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-exporter-queries }
data:
  queries.yaml: |
    ssdf_evidence_chain:
      query: "SELECT CASE WHEN valid THEN 0 ELSE 1 END AS tamper_detected FROM verify_evidence_chain()"
      metrics:
        - tamper_detected:
            usage: "GAUGE"
            description: "Whether SSDF evidence hash chain verification detected tampering (1 means detected)."
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres-exporter } }
  template:
    metadata: { labels: { app: postgres-exporter } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: exporter
          image: {{ .Values.postgresExporter.image | quote }}
          env:
            - { name: DATA_SOURCE_URI, value: "ssdf-postgres.ssdf-system.svc:5432/ssdf?sslmode=disable" }
            - name: DATA_SOURCE_USER
              valueFrom: { secretKeyRef: { name: postgres-exporter-credential, key: username } }
            - name: DATA_SOURCE_PASS
              valueFrom: { secretKeyRef: { name: postgres-exporter-credential, key: password } }
          ports: [{ name: metrics, containerPort: 9187 }]
          args: ["--extend.query-path=/etc/postgres-exporter/queries.yaml"]
          readinessProbe: { httpGet: { path: /metrics, port: metrics }, initialDelaySeconds: 5 }
          volumeMounts:
            - { name: custom-queries, mountPath: /etc/postgres-exporter, readOnly: true }
      volumes:
        - name: custom-queries
          configMap: { name: postgres-exporter-queries }
---
apiVersion: v1
kind: Service
metadata: { name: postgres-exporter }
spec:
  selector: { app: postgres-exporter }
  ports: [{ name: metrics, port: 9187, targetPort: metrics }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus }
spec:
  # A single TSDB PVC cannot safely be opened by surge and old Pods together.
  # Recreate makes configuration updates wait for the old writer to exit.
  strategy: { type: Recreate }
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image | quote }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 10 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            {{- if .Values.phase11.enabled }}
            - { name: phase11-rules, mountPath: /etc/prometheus/rules/phase11, readOnly: true }
            {{- end }}
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: rules, configMap: { name: prometheus-rules } }
        {{- if .Values.phase11.enabled }}
        - { name: phase11-rules, configMap: { name: phase11-prometheus-rules } }
        {{- end }}
        - { name: data, persistentVolumeClaim: { claimName: prometheus-data } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus }
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prometheus-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.storage.size | quote }} } }
---
{{- if .Values.grafana.manageAdminSecret }}
{{- if not .Values.grafana.adminPassword }}{{ fail "grafana.adminPassword is required when manageAdminSecret=true" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  annotations: { helm.sh/resource-policy: keep }
type: Opaque
stringData:
  admin-password: {{ .Values.grafana.adminPassword | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-password } } }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 10 }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: provisioning, configMap: { name: grafana-provisioning } }
        - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: grafana-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.storage.size | quote }} } }
