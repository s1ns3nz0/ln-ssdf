{{- if not .Values.auth.bootstrapPassword }}
{{- fail "auth.bootstrapPassword is required; provide it at install time and do not commit it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ln-ssdf-postgres.fullname" . }}-bootstrap
  labels:
    app.kubernetes.io/name: {{ include "ln-ssdf-postgres.name" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.auth.bootstrapPassword | quote }}
