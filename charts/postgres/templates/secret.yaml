{{- if .Values.auth.manageBootstrapSecret }}
{{- if not .Values.auth.bootstrapPassword }}{{ fail "auth.bootstrapPassword is required when manageBootstrapSecret=true" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ln-ssdf-postgres.fullname" . }}-bootstrap
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: {{ include "ln-ssdf-postgres.name" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.auth.bootstrapPassword | quote }}
{{- end }}
