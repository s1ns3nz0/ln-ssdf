apiVersion: v1
kind: ConfigMap
metadata: { name: phase11-loki-config }
data:
  loki.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100 }
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: { kvstore: { store: inmemory } }
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
    storage_config:
      filesystem: { directory: /loki/chunks }
    limits_config:
      retention_period: {{ .Values.retention.logs | quote }}
      allow_structured_metadata: true
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: loki
          image: {{ .Values.images.loki | quote }}
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{ name: http, containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 5 }
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
      volumes:
        - { name: config, configMap: { name: phase11-loki-config } }
        - { name: data, persistentVolumeClaim: { claimName: loki-data } }
---
apiVersion: v1
kind: Service
metadata: { name: loki }
spec:
  selector: { app: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: loki-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.storage.size | quote }} } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: phase11-tempo-config }
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server: { http_listen_port: 3200 }
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
            http: { endpoint: 0.0.0.0:4318 }
    ingester: { max_block_duration: 5m }
    compactor:
      compaction: { block_retention: {{ .Values.retention.traces }} }
    storage:
      trace:
        backend: local
        local: { path: /var/tempo/traces }
        wal: { path: /var/tempo/wal }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tempo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tempo } }
  template:
    metadata: { labels: { app: tempo } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tempo
          image: {{ .Values.images.tempo | quote }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports: [{ name: http, containerPort: 3200 }, { name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }]
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 5 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo, readOnly: true }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - { name: config, configMap: { name: phase11-tempo-config } }
        - { name: data, persistentVolumeClaim: { claimName: tempo-data } }
---
apiVersion: v1
kind: Service
metadata: { name: tempo }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tempo-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.storage.size | quote }} } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: phase11-otel-collector-config }
data:
  collector.yaml: |
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 256 }
      batch: { timeout: 5s }
      transform/redact:
        error_mode: propagate
        log_statements:
          - context: log
            statements:
              - delete_key(attributes, "authorization")
              - delete_key(attributes, "cookie")
              - delete_key(attributes, "l402")
              - delete_key(attributes, "macaroon")
              - delete_key(attributes, "preimage")
              - delete_key(attributes, "seed")
              - replace_pattern(body, "(?i)(authorization|macaroon|preimage|seed|openrouter[_-]?key|api[_-]?key)\\s*[=:]\\s*[^,\\s]+", "$1=[REDACTED]")
        trace_statements:
          - context: span
            statements:
              - delete_key(attributes, "http.request.header.authorization")
              - delete_key(attributes, "l402")
              - delete_key(attributes, "macaroon")
              - delete_key(attributes, "preimage")
    exporters:
      otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }
      otlphttp/loki: { endpoint: http://loki:3100/otlp }
    service:
      extensions: [health_check]
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, transform/redact, batch], exporters: [otlp/tempo] }
        logs: { receivers: [otlp], processors: [memory_limiter, transform/redact, batch], exporters: [otlphttp/loki] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: {{ .Values.images.otelCollector | quote }}
          args: ["--config=/etc/otel/collector.yaml"]
          ports: [{ name: health, containerPort: 13133 }, { name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }]
          readinessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 5 }
          volumeMounts: [{ name: config, mountPath: /etc/otel, readOnly: true }]
      volumes: [{ name: config, configMap: { name: phase11-otel-collector-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
